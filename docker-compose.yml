version: "3.8"

services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - devTinder-net

  backend1:
    build: .
    environment:
      
    depends_on:
      - redis
    ports:
      - "3000:3000"
    networks:
      - devTinder-net

  backend2:
    build: .
    environment:
      
    depends_on:
      - redis
    ports:
      - "3001:3001"
    networks:
      - devTinder-net

networks:
  devTinder-net:
    driver: bridge